# --- Camera sensor IDs (passed to Camera.open(sensor_id=...)) ---
camera0: 0   # right camera
camera1: 1   # left camera

# --- Frame / capture settings ---
frame_width: 1280
frame_height: 720
view_resize: 2          # display frames scaled down by this factor (not used for saved frames)
cooldown: 50             # frames to wait between auto-saves once capture starts

# --- How many frames to collect ---
mono_calibration_frames: 15     # per camera, for intrinsics
stereo_calibration_frames: 15   # simultaneous pairs, for extrinsics

# --- Checkerboard pattern ---
checkerboard_rows: 6
checkerboard_columns: 9
checkerboard_box_size_scale: 24   # mm (or any consistent unit) per square